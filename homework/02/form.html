<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開發者社群會員註冊</title>
    <style>
        /* 基礎重置與全域設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* 讓背景充滿視窗，並使用 Flexbox 將內容垂直與水平置中 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            padding: 20px;
        }

        /* 卡片主體設計 */
        .form-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        /* 表單群組，用於產生每個輸入區塊的間距 */
        .form-group {
            margin-bottom: 20px;
        }

        /* 標籤樣式 */
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* 文字、密碼、日期、下拉選單、多行文字的共通樣式 */
        input[type="text"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #4dabf7;
            box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.2);
        }

        /* 單選與核取方塊的排版 */
        .inline-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .inline-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }

        .inline-group input {
            margin-right: 6px;
        }

        /* 特殊輸入控制項微調 */
        input[type="file"] {
            font-size: 0.9rem;
            color: #555;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        input[type="color"] {
            width: 50px;
            height: 35px;
            padding: 2px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 提交按鈕設計 */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #2b8a3e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #237032;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>會員註冊</h2>
        <form action="#" method="post">
            
            <div class="form-group">
                <label for="username">使用者名稱</label>
                <input type="text" id="username" name="username" placeholder="請輸入帳號" required>
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" placeholder="請輸入密碼" required>
            </div>

            <div class="form-group">
                <label>目前身分</label>
                <div class="inline-group">
                    <label><input type="radio" name="role" value="student" checked> 學生</label>
                    <label><input type="radio" name="role" value="employed"> 在職工程師</label>
                    <label><input type="radio" name="role" value="other"> 其他</label>
                </div>
            </div>

            <div class="form-group">
                <label for="department">就讀/畢業科系</label>
                <select id="department" name="department">
                    <option value="" disabled selected>請選擇科系...</option>
                    <option value="csie">資訊工程學系</option>
                    <option value="ee">電機工程學系</option>
                    <option value="im">資訊管理學系</option>
                    <option value="other">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label>擅長的技術或工具 (可複選)</label>
                <div class="inline-group">
                    <label><input type="checkbox" name="skills" value="js"> JavaScript</label>
                    <label><input type="checkbox" name="skills" value="c"> C</label>
                    <label><input type="checkbox" name="skills" value="nodejs"> C++</label>
                </div>
            </div>

            <div class="form-group">
                <label for="birthday">生日</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <label for="avatar">上傳個人大頭貼</label>
                <input type="file" id="avatar" name="avatar" accept="image/*">
            </div>

            <div class="form-group">
                <label for="experience">開發經驗熟悉度</label>
                <input type="range" id="experience" name="experience" min="1" max="10" value="5">
            </div>

            <div class="form-group">
                <label for="theme_color">選擇個人網誌主題色</label>
                <input type="color" id="theme_color" name="theme_color" value="#4dabf7">
            </div>

            <div class="form-group">
                <label for="bio">簡短自我介紹</label>
                <textarea id="bio" name="bio" rows="4" placeholder="請描述一下你的興趣或開發經驗..."></textarea>
            </div>

            <button type="submit" class="submit-btn">完成註冊</button>

        </form>
    </div>

</body>
</html>
