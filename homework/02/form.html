<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊</title>
    <style>
        /* 1. 基礎頁面設定與置中排版 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center; /* 水平置中 */
            align-items: center;     /* 垂直置中 */
            min-height: 100vh;       /* 確保高度至少為整個視窗 */
        }

        /* 2. 卡片主體樣式 */
        .form-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); /* 柔和的卡片陰影 */
            box-sizing: border-box;
        }

        .form-card h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* 3. 表單元素群組 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555555;
            font-size: 14px;
        }

        /* 4. 共用輸入框樣式 */
        input[type="text"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box; /* 確保 padding 不會撐破寬度 */
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        /* 聚焦時的邊框顏色變化 */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
        }

        textarea {
            resize: vertical; /* 允許使用者垂直拉伸，禁止水平拉伸 */
            min-height: 80px;
        }

        /* 5. 特殊輸入項排版 (單選、核取) */
        .inline-group {
            display: flex;
            align-items: center;
            gap: 15px; /* 元素之間的間距 */
        }

        .inline-group label {
            display: inline;
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }

        /* 6. HTML5 進階輸入項微調 */
        input[type="file"] {
            font-size: 13px;
            color: #555;
        }

        .color-range-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="range"] {
            flex-grow: 1;
        }

        /* 7. 提交按鈕樣式 */
        .submit-btn {
            width: 100%;
            background-color: #4a90e2;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>建立新帳號</h2>
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="username">使用者名稱</label>
                <input type="text" id="username" name="username" placeholder="請輸入您的名稱" required>
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" placeholder="請設定 8 碼以上的密碼" required>
            </div>

            <div class="form-group">
                <label for="job">職業領域</label>
                <select id="job" name="job">
                    <option value="">請選擇...</option>
                    <option value="student">學生</option>
                    <option value="engineer">工程師</option>
                    <option value="designer">設計師</option>
                    <option value="other">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label>性別</label>
                <div class="inline-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">男性</label>
                    
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">女性</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">不透露</label>
                </div>
            </div>

            <div class="form-group">
                <label for="birthday">生日</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <label for="avatar">上傳個人頭像</label>
                <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg">
            </div>

            <div class="form-group">
                <label>介面偏好設定</label>
                <div class="color-range-group">
                    <input type="color" id="theme-color" name="theme-color" value="#4a90e2" title="選擇主題顏色">
                    <input type="range" id="fontSize" name="fontSize" min="12" max="24" value="16" title="字體大小">
                </div>
            </div>

            <div class="form-group">
                <label for="bio">個人簡介</label>
                <textarea id="bio" name="bio" placeholder="簡單介紹一下你自己吧..."></textarea>
            </div>

            <div class="form-group inline-group" style="margin-top: 20px;">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms" style="font-size: 13px;">我已閱讀並同意<a href="#">服務條款</a>與隱私權政策</label>
            </div>

            <button type="submit" class="submit-btn">立即註冊</button>

        </form>
    </div>

</body>
</html>
