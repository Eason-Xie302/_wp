<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人簡歷 - 謝易宸</title>
    <style>
        /* 定義全局顏色與變數 */
        :root {
            --bg-color: #f4f5f7;        /* 乾淨的淺灰色背景 */
            --card-bg: #ffffff;         /* 卡片純白背景 */
            --primary-text: #2c3e50;    /* 主標題顏色 */
            --secondary-text: #5c6a79;  /* 次要文字顏色 */
            --accent-color: #3498db;    /* 點綴色 (科技感藍色) */
        }

        /* 網頁基本設定 */
        body {
            /* 現代感、易讀的無襯線字體 */
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            
            /* 使用 Flexbox 將內容在畫面中完美置中 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 卡片容器設計 */
        .resume-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px; /* 限制最大寬度 */
            border-radius: 16px; /* 圓角 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); /* 柔和的陰影 */
            padding: 40px;
            box-sizing: border-box;
            transition: transform 0.3s ease; /* 增加一點互動感 */
        }

        .resume-card:hover {
            transform: translateY(-5px); /* 滑鼠游標移入時微微浮起 */
        }

        /* 標題層次與排版 */
        .header {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid #edf2f7;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 2.4em;
            letter-spacing: 2px;
            color: var(--primary-text);
        }

        .section {
            margin-bottom: 25px;
        }

        h2 {
            font-size: 1.2em;
            color: var(--primary-text);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        /* 標題旁的小裝飾線條，增加層次感 */
        h2::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-color);
            margin-right: 10px;
            border-radius: 2px;
        }

        /* 列表與內文排版 */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 10px;
            color: var(--secondary-text);
            font-size: 1.05em;
        }

        /* 興趣標籤特殊排版 */
        .interests-list li {
            display: inline-block;
            background-color: #f8f9fa;
            padding: 8px 16px;
            border-radius: 20px;
            margin-right: 10px;
            margin-bottom: 10px;
            font-size: 0.95em;
            border: 1px solid #e9ecef;
            color: var(--primary-text);
        }

        /* 聯絡方式區塊 */
        .contact-box {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .contact-box a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .contact-box a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        /* 手機版響應式設計調整 */
        @media (max-width: 480px) {
            .resume-card {
                padding: 25px;
            }
            h1 {
                font-size: 2em;
            }
            .interests-list li {
                display: block;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>

    <div class="resume-card">
        <div class="header">
            <h1>謝易宸</h1>
        </div>

        <div class="section">
            <h2>學歷</h2>
            <ul>
                <li>🎓 <strong>金門大學</strong> 資訊工程學系 (大一就讀中)</li>
                <li>🏫 <strong>華江高中</strong> (畢業)</li>
            </ul>
        </div>

        <div class="section">
            <h2>基本資料</h2>
            <ul>
                <li>🎂 <strong>生日：</strong> 96年03月02日</li>
                <li>🆔 <strong>學號：</strong> 111410514</li>
            </ul>
        </div>

        <div class="section">
            <h2>興趣</h2>
            <ul class="interests-list">
                <li>🎮 玩線上遊戲</li>
                <li>📺 看動漫</li>
                <li>📖 閱讀小說</li>
            </ul>
        </div>

        <div class="section">
            <h2>聯絡方式</h2>
            <div class="contact-box">
                📧 <strong>Email：</strong> 
                <a href="mailto:s111410514@student.nqu.edu.tw">s111410514@student.nqu.edu.tw</a>
            </div>
        </div>
    </div>

</body>
</html>
